name: Release
run-name: Release v${{ inputs.version }} with apply=${{ inputs.apply }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: version. The next release version (without prefix v)
        required: true
      apply:
        description: apply. Specify whether the actual release should be performed or not
        type: boolean
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # `version` is written into a Ruby file and executed by `gem build`;
      # reject anything that is not a plain version before that.
      - name: Validate version
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          if [[ ! "$INPUTS_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid version input; expected a numeric version"
            exit 1
          fi

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1.339.0
        with:
          ruby-version: "4"
          bundler-cache: true

      - name: Validate RubyGems version
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          ruby -e 'abort "invalid version" unless Gem::Version.correct?(ENV.fetch("INPUTS_VERSION"))'

      - name: Update `StrongCSV::VERSION`
        env:
          INPUTS_VERSION: ${{ inputs.version }}
        run: |
          ruby -e '
            version = ENV.fetch("INPUTS_VERSION")
            File.write("lib/strong_csv/version.rb", "# frozen_string_literal: true\n\nclass StrongCSV\n  VERSION = #{version.dump}\nend\n")
          '

      - run: git diff

      # The direct push of the bump commit cannot carry the required checks, so
      # GitHub rejects it with GH006 unless the release app (ID 872868) is a
      # bypass actor with mode "Always" on the "Require CI on main" ruleset.
      - uses: yykamei/actions-git-push@423a63c2b538dca1f485a0eb7f569d2546cd49a0 # main
        with:
          commit-message: Bump to ${{ inputs.version }}
        if: inputs.apply

      - run: gem build strong_csv.gemspec

      - run: gem push ./*.gem
        if: inputs.apply

      - uses: yykamei/actions-release-actions@ebcee1950d6798f9356621195f43038cfd39973e # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag: v${{ inputs.version }}
          overwrite-major-minor: "false"
          apply: ${{ inputs.apply }}
