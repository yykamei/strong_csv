name: Release
run-name: Release v${{ inputs.version }} with apply=${{ inputs.apply }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: version. The next release version (without prefix v)
        required: true
      apply:
        description: apply. Specify whether the actual release should be performed or not
        type: boolean
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          permission-contents: write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - uses: ruby/setup-ruby@651ff0d62c5c79bed6d53ec518387aae20e72c1a # v1.329.0
        with:
          ruby-version: "3"
          bundler-cache: true

      - name: Update `StrongCSV::VERSION`
        run: |
          cat <<RUBY > lib/strong_csv/version.rb
          # frozen_string_literal: true

          class StrongCSV
            VERSION = "${INPUTS_VERSION}"
          end
          RUBY
        env:
          INPUTS_VERSION: ${{ inputs.version }}

      - run: git diff

      - uses: yykamei/actions-git-push@423a63c2b538dca1f485a0eb7f569d2546cd49a0 # main
        with:
          commit-message: Bump to ${{ inputs.version }}
        if: inputs.apply

      - run: gem build strong_csv.gemspec

      - run: gem push ./*.gem
        if: inputs.apply

      - uses: yykamei/actions-release-actions@ebcee1950d6798f9356621195f43038cfd39973e # main
        with:
          token: ${{ steps.app-token.outputs.token }}
          tag: v${{ inputs.version }}
          overwrite-major-minor: "false"
          apply: ${{ inputs.apply }}
